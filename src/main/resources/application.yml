# 공통 설정. 환경별 값(DB 접속 등)은 application-{profile}.yml 또는 환경 변수로 둔다.
spring:
  application:
    name: come-down
  config:
    import: optional:file:.env[.properties]
  jackson:
    # 응답 시각은 서울 오프셋(+09:00)을 붙인 ISO 8601. 서비스 시간 규칙은 shared.time.ServiceTime 참고.
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
server:
  port: 8080
  # 프록시(로드밸런서·Cloud Run 등) 뒤에서는 TLS가 프록시에서 끝나 앱이 HTTP로 받는다. framework로 두면 X-Forwarded-*
  # 헤더로 원래 주소(https·호스트)를 복원해 구글 리디렉션 URI와 쿠키의 Secure가 맞게 나온다. 이 헤더는 누구나 보낼 수
  # 있으므로, 프록시를 거치지 않고 앱에 직접 닿을 수 있는 환경에서는 켜지 않는다. 기본은 none(로컬에는 프록시가 없다).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
comedown:
  google:
    # 비어 있으면 Google 로그인·캘린더 연결 경로가 만들어지지 않는다(local은 테스트 로그인 사용).
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  # 구글 토큰 암호화 키(Base64 32바이트). 실제 값은 환경 변수로만 둔다.
  token-key: ${COMEDOWN_TOKEN_KEY:}
# AI 클라이언트는 integration 구현 PR에서 추가한다.
# Spring Session 테이블도 Flyway migration으로 만든다(initialize-schema: never).
