# 로컬 전용 설정. docker-compose.yml의 MySQL(3307)과 맞춘다. 운영 비밀값이 아니다.
spring:
  config:
    # 저장소 루트의 .env(Git 제외)를 읽는다: GOOGLE_*·COMEDOWN_TOKEN_KEY·OPENAI_* 값을 따로 export하지 않아도 된다.
    # 파일이 없으면 건너뛰고, 같은 이름의 실제 환경 변수가 있으면 그 값이 우선한다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3307/comedown
    username: comedown
    password: comedown-local
comedown:
  security:
    # 운영은 캘린더 권한 없는 세션의 API 요청을 막는다(기본 true). local은 테스트 로그인(/api/dev/login)과
    # 28일차 시연 데이터 사용자를 캘린더 없이 쓰므로 끈다.
    require-calendar: false
  hrv:
    # 측정 원신호를 임계값 조정용 파일로 남긴다(local 전용, 기본 꺼짐). 위치는 Git 제외 경로.
    signal-recording:
      enabled: false
      dir: recordings
