# 테스트 프로필. DB는 Testcontainers(MySQL 8.4)로 띄우고, 시간은 test/support의 고정 Clock을 사용한다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
comedown:
  # 테스트 전용 더미 키(0x00 32바이트). 실제 키가 아니다.
  token-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  openai:
    # 테스트는 실제 OpenAI를 부르지 않는다(개발자 환경 변수에 키가 있어도 무시).
    api-key: ""
