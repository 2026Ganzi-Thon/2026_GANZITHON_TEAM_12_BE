name: CD

# main의 CI(빌드·테스트·문서 동기화)가 통과하면 Cloud Run에 배포한다.
# 프론트만 바뀌었을 때는 Actions 화면에서 이 워크플로를 직접 실행한다(Run workflow, main).
# 절차와 GCP·GitHub 준비는 docs/배포_가이드.md 7.4절.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 배포는 한 번에 하나씩, 들어온 순서대로. 기다리는 배포는 가장 최근 것만 남는다.
concurrency:
  group: cd-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GCP 키 없이 Workload Identity로 인증한다.

jobs:
  deploy:
    name: Cloud Run 배포
    # - 저장소 변수(GCP 설정)가 없으면 건너뛴다.
    # - 자동 배포는 main에 push된 커밋의 CI가 성공했을 때만(PR·포크의 CI는 제외).
    # - 직접 실행은 main에서만.
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CLOUD_SQL_PRIVATE_IP: ${{ vars.CLOUD_SQL_PRIVATE_IP }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      DEPLOY_WITH_OPENAI: ${{ vars.DEPLOY_WITH_OPENAI }}
    steps:
      # 자동 배포는 CI가 검사한 바로 그 커밋을 배포한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 프론트 저장소 가져오기(main)
        uses: actions/checkout@v4
        with:
          repository: 2026Ganzi-Thon/2026_GANZITHON_TEAM_12_FE
          ref: main
          path: frontend

      # 프론트 앱(Expo)은 저장소의 mobile/ 아래에 있다. 나중에 맨 위로 옮겨도 그대로 돌게 맨 위를 먼저 본다.
      - name: 프론트 빌드 대상 확인
        id: fe
        run: |
          for dir in frontend frontend/mobile; do
            if [ -f "$dir/package.json" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              echo "::notice::프론트 앱 위치: $dir"
              exit 0
            fi
          done
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "::notice::프론트 저장소 main에 package.json이 없어 확인용 화면으로 배포합니다."

      - name: Node 설치
        if: steps.fe.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 운영 빌드는 실제 API를 불러야 한다. 프론트 client.js의 목업 스위치(USE_MOCK)가 켜져 있으면
      # 이 빌드에서만 끄고(프론트 저장소는 바꾸지 않음), 그래도 켜져 있으면 목업 화면을 배포하지 않도록 멈춘다.
      # 빌드 명령: package.json에 build 스크립트가 있으면 그것을, 없으면 Expo 웹 빌드(expo export)를 쓴다.
      - name: 프론트 빌드
        if: steps.fe.outputs.build == 'true'
        working-directory: ${{ steps.fe.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          client=src/api/client.js
          if [ -f "$client" ]; then
            if grep -Eq '^\s*const\s+USE_MOCK\s*=\s*true\s*;?' "$client"; then
              sed -i -E 's/^(\s*const\s+USE_MOCK\s*=\s*)true(\s*;?)/\1false\2/' "$client"
              echo "::notice::프론트 USE_MOCK을 이 배포 빌드에서만 false로 바꿨습니다."
            fi
            if grep -Eq 'USE_MOCK\s*=\s*true' "$client"; then
              echo "::error::프론트가 목업 모드(USE_MOCK = true)라 배포하지 않습니다."
              exit 1
            fi
          fi
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            npx expo export --platform web --output-dir dist
          fi
          test -f dist/index.html || { echo "::error::프론트 빌드 결과에 dist/index.html이 없습니다."; exit 1; }

      - name: GCP 인증(Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: gcloud 설치
        uses: google-github-actions/setup-gcloud@v2

      # 로컬 배포와 같은 스크립트를 쓴다: 두 이미지 빌드·push → services replace → 공개 호출 권한.
      - name: 배포
        shell: pwsh
        env:
          FRONTEND_BUILD: ${{ steps.fe.outputs.build }}
          FRONTEND_DIR: ${{ steps.fe.outputs.dir }}
        run: |
          $params = @{
              ProjectId      = $env:GCP_PROJECT_ID
              DbHost         = $env:CLOUD_SQL_PRIVATE_IP
              GoogleClientId = $env:GOOGLE_CLIENT_ID
          }
          if ($env:FRONTEND_BUILD -eq 'true') { $params.FrontendDist = "$env:FRONTEND_DIR/dist" }
          if ($env:DEPLOY_WITH_OPENAI -eq 'true') { $params.WithOpenAi = $true }
          ./scripts/deploy-cloudrun.ps1 @params

      - name: 배포 확인
        run: |
          number=$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')
          url="https://comedown-${number}.asia-northeast3.run.app"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url/api/auth/csrf")
          echo "GET $url/api/auth/csrf -> $code"
          echo "배포 주소: $url (GET /api/auth/csrf $code)" >> "$GITHUB_STEP_SUMMARY"
          test "$code" = "204"
