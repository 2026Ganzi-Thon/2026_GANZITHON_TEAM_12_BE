# Cloud Run 진입 컨테이너(nginx) 설정. 이 파일은 nginx 이미지의 http 블록 안에 들어간다.
# - 같은 주소에서 프론트 정적 파일을 주고, /api·/oauth2·/login/oauth2만 같은 인스턴스의 백엔드(127.0.0.1:8081)로 넘긴다.
# - 백엔드는 이 프록시를 거쳐서만 닿는다(Cloud Run이 밖으로 여는 포트는 이 컨테이너의 8080뿐).

# Cloud Run 앞단(구글 프론트엔드)이 붙인 X-Forwarded-Proto를 그대로 쓴다. 없으면(로컬 확인) 실제 접속 방식.
map $http_x_forwarded_proto $comedown_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # HRV 측정 원신호(t·r·g 배열)를 한 번에 올린다.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    location ~ ^/(api|oauth2|login/oauth2)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # 백엔드(SERVER_FORWARD_HEADERS_STRATEGY=framework)가 이 값으로 https 주소와 Secure 쿠키를 만든다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $comedown_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 클라이언트가 보낸 다른 전달 헤더가 위 값을 덮지 못하게 비운다(Spring은 Forwarded를 먼저 읽는다).
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";

        # 캘린더 동기화·AI 문구 생성처럼 외부 호출이 끼는 요청을 기다린다(Cloud Run 요청 제한 시간과 맞춘다).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite 빌드 산출물은 파일명에 해시가 붙어 오래 캐시해도 된다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅: 없는 경로는 index.html로 돌려보낸다. index.html은 배포 직후 바로 바뀌도록 캐시하지 않는다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
